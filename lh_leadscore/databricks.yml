# This is a Declarative Automation Bundle definition for lh_leadscore.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: lh_leadscore
  uuid: 55837461-dc5c-4a4a-9dac-a4a67a6b016d

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: Catálogo Unity Catalog do Lead Score
  schema:
    description: Schema padrão do pipeline (as tabelas usam bronze/silver/gold explicitamente)
  warehouse_id:
    description: SQL warehouse usado pelo app e pelo Genie
    default: 4c2bc55088722e76
  genie_space_id:
    description: ID do Genie Space do agente comercial (criado na T4.5 por src/genie/gerar_space.py)
    default: 01f1e9d8c6461adc876c8997ad891040
  genie_space_name:
    description: Nome do Genie Space
    default: Lead Score · Agente Comercial
  app_name:
    description: Nome do Databricks App (minúsculas, números e hífens, até 30 caracteres)
    default: leadscore-${workspace.current_user.domain_friendly_name}

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-be577084-5742.cloud.databricks.com?w=7474647553344962
    variables:
      catalog: leadscore
      schema: bronze
  prod:
    mode: production
    workspace:
      host: https://dbc-be577084-5742.cloud.databricks.com?w=7474647553344962
      # We explicitly deploy to /Workspace/Users/leadscorews@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/leadscorews@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: leadscore
      schema: bronze
      app_name: leadscore
    permissions:
      - user_name: leadscorews@gmail.com
        level: CAN_MANAGE
